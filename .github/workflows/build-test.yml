name: Build and Test

on:
  push:
    branches: [ main, testing, develop ]
  pull_request:
    branches: [ testing, develop ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '9.0.x'
    
    - name: Restore dependencies
      run: dotnet restore
    
    - name: Build
      run: dotnet build --no-restore
    
    - name: Test
      run: dotnet test --no-build --verbosity normal

  android-build:
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '9.0.x'
    
    - name: Setup Java
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v2
    
    - name: Install Workloads
      run: dotnet workload install android
    
    - name: Build Android
      run: dotnet build -c Release -f net9.0-android /p:AndroidSdkDirectory=$ANDROID_SDK_ROOT
      
    - name: Upload Android Artifacts
      uses: actions/upload-artifact@v2
      with:
        name: android-build
        path: src/VillageGame.Game/bin/Release/net9.0-android/
        retention-days: 5

  ios-build:
    runs-on: macos-latest
    needs: build-and-test
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '9.0.x'
    
    - name: Install Workloads
      run: dotnet workload install ios
    
    - name: Build iOS
      run: dotnet build -c Release -f net9.0-ios
      
    - name: Upload iOS Artifacts
      uses: actions/upload-artifact@v2
      with:
        name: ios-build
        path: src/VillageGame.Game/bin/Release/net9.0-ios/
        retention-days: 5 